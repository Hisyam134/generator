<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 1: Generator Kode Riwayat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Mengatur tema tampilan gelap seperti pada gambar sampel */
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background: #1a1a1a; 
            color: #ffffff;
        }
        .box { 
            max-width: 450px; 
            margin: 0 auto; 
            background: #222222; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        button { 
            padding: 12px 20px; 
            font-size: 1rem; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 25px;
        }
        button:hover { background: #0056b3; }
        
        /* Wadah utama QR dan Teks agar tersusun vertikal ke bawah */
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .qrcode-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 160px; 
        }

        /* CSS QR Code agar transparan dan mengikuti filter tema HP */
        #qrcode {
            background-color: transparent !important; 
            padding: 10px !important;              
            display: inline-block !important;
        }
        #qrcode img, #qrcode canvas {
            background-color: transparent !important; 
            filter: invert(1) contrast(2); /* Membuat pola QR berwarna terang/putih di latar gelap */
        }

        /* Mengatur teks kode unik berada di bawah, berukuran kecil, dan agak renggang */
        #kode-output { 
            font-size: 1.2rem; /* Ukuran teks dibuat lebih kecil */
            font-weight: bold; 
            margin-top: 15px; /* Jarak aman di bawah QR Code */
            color: #e0e0e0; 
            letter-spacing: 1px; 
            word-break: break-all; 
        }
        
        .status { color: #28a745; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Web 1: Generator (Sistem Riwayat)</h2>
    <p style="color: #aaa;">Pencet tombol untuk membuat kode alfanumerik & QR Code baru:</p>
    
    <div class="qr-wrapper">
        <div class="qrcode-container">
            <div id="qrcode"></div>
        </div>
        <div id="kode-output">-----</div>
    </div>

    <button onclick="generateDanKirim()">🎲 Buat & Kirim Kode</button>
    <p id="status-kirim" class="status"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://tiketcom-5d185-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Inisialisasi QR Code dengan background transparan
    let qrcodeInstance = new QRCode(document.getElementById("qrcode"), { 
        width: 160, 
        height: 160,
        colorDark : "#000000", 
        colorLight : "rgba(0,0,0,0)"
    });

    // Fungsi membuat kombinasi huruf dan angka tanpa simbol
    function buatStringAcak(panjang) {
        const karakter = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let hasil = '';
        for (let i = 0; i < panjang; i++) {
            hasil += karakter.charAt(Math.floor(Math.random() * karakter.length));
        }
        return hasil;
    }

    window.generateDanKirim = function() {
        const awalan = buatStringAcak(5);
        const angkaTengah = Math.floor(10000 + Math.random() * 90000).toString(); 
        const akhiran = buatStringAcak(5);
        
        // Penggabungan langsung tanpa tanda strip/simbol apa pun
        const kodeGabungan = `${awalan}${angkaTengah}${akhiran}`;

        // Memasukkan data ke QR Code dan teks di bawahnya
        document.getElementById('kode-output').innerText = kodeGabungan;
        qrcodeInstance.makeCode(kodeGabungan);
        document.getElementById('status-kirim').innerText = "Menyimpan...";

        const riwayatRef = ref(database, 'sistem/riwayat_kode');
        const dataBaruRef = push(riwayatRef);
        
        set(dataBaruRef, {
            angka: kodeGabungan, 
            timestamp: Date.now()
        }).then(() => {
            document.getElementById('status-kirim').innerText = "✅ Kode disimpan ke riwayat!";
            jalankanPembersihanOtomatis();
        });
    }

    function jalankanPembersihanOtomatis() {
        const riwayatRef = ref(database, 'sistem/riwayat_kode');
        get(riwayatRef).then((snapshot) => {
            if (snapshot.exists()) {
                const semuaData = snapshot.val();
                const kunciData = Object.keys(semuaData);
                
                if (kunciData.length > 150) {
                    const jumlahYangDihapus = kunciData.length - 150;
                    for (let i = 0; i < jumlahYangDihapus; i++) {
                        set(ref(database, 'sistem/riwayat_kode/' + kunciData[i]), null);
                    }
                }
            }
        });
    }
</script>
</body>
</html>

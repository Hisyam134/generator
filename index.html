<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 1: Generator Kode Riwayat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #eef2f3; }
        .box { max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { padding: 15px 25px; font-size: 1.2rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px;}
        button:hover { background: #0056b3; }
        #kode-output { font-size: 2.5rem; font-weight: bold; margin: 10px 0; color: #333; letter-spacing: 3px; }
        .qrcode-container { margin: 20px 0; display: flex; justify-content: center; align-items: center; min-height: 150px; }
        .status { color: #28a745; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="box">
    <h2>Web 1: Generator (Sistem Riwayat)</h2>
    <p>Pencet tombol untuk membuat angka acak & QR Code baru:</p>
    <div id="kode-output">-----</div>
    <div class="qrcode-container"><div id="qrcode"></div></div>
    <button onclick="generateDanKirim()">🎲 Buat & Kirim Kode</button>
    <p id="status-kirim" class="status"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, query, orderByKey, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://tiketcom-5d185-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let qrcodeInstance = new QRCode(document.getElementById("qrcode"), { width: 150, height: 150 });

    window.generateDanKirim = function() {
        const angkaAcak = Math.floor(10000 + Math.random() * 90000).toString();
        document.getElementById('kode-output').innerText = angkaAcak;
        qrcodeInstance.makeCode(angkaAcak);
        document.getElementById('status-kirim').innerText = "Menyimpan...";

        // 1. Simpan kode baru ke jalur 'sistem/riwayat_kode' menggunakan push() agar punya ID unik
        const riwayatRef = ref(database, 'sistem/riwayat_kode');
        const dataBaruRef = push(riwayatRef);
        
        set(dataBaruRef, {
            angka: angkaAcak,
            timestamp: Date.now()
        }).then(() => {
            document.getElementById('status-kirim').innerText = "✅ Kode disimpan ke riwayat!";
            
            // 2. Pembersihan otomatis: Hapus data lama jika sudah lebih dari 150
            jalankanPembersihanOtomatis();
        });
    }

    function jalankanPembersihanOtomatis() {
        const riwayatRef = ref(database, 'sistem/riwayat_kode');
        // Ambil data keseluruhan
        get(riwayatRef).then((snapshot) => {
            if (snapshot.exists()) {
                const semuaData = snapshot.val();
                const kunciData = Object.keys(semuaData); // List semua ID unik
                
                // Jika total kode terdaftar sudah melebihi 150
                if (kunciData.length > 150) {
                    const jumlahYangDihapus = kunciData.length - 150;
                    // Hapus dari yang paling lama (index awal)
                    for (let i = 0; i < jumlahYangDihapus; i++) {
                        set(ref(database, 'sistem/riwayat_kode/' + kunciData[i]), null);
                    }
                }
            }
        });
    }
</script>
</body>
</html>
